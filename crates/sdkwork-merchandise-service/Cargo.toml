[package]
rust-version.workspace = true
name = "sdkwork-merchandise-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SDKWork commerce merchandise domain rules for SPU, SKU, categories, attributes, and price lists."


[lints]
workspace = true
[lib]
name = "sdkwork_merchandise_service"
path = "src/lib.rs"

[dependencies]
# `serde_json` is a real dependency, not a test one: the media read model carries the
# `commerce_product_media.resource_snapshot` JSONB projection, and the write model validates the
# `MediaResource` document the caller submits before it can become a reference.
serde_json = { workspace = true }
sdkwork_contract_service.workspace = true

[dev-dependencies]
tokio = { workspace = true }
