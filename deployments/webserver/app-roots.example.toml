# Adaptive Web roots for sdkwork-merchandise (copy into runtime config when in-process).
# Docker entrypoint generates /etc/sdkwork/webserver/module-app-roots/sdkwork-merchandise.toml

[app_roots]
tablet_surface = "pc"

[app_roots.pc_static_by_environment]
development = "apps/sdkwork-merchandise-pc/dist/standalone/dev"
test = "apps/sdkwork-merchandise-pc/dist/standalone/test"
staging = "apps/sdkwork-merchandise-pc/dist/standalone/staging"
production = "apps/sdkwork-merchandise-pc/dist/standalone/prod"

[app_roots.static_fallback_by_environment]
development = "deployments/webserver/static"
test = "deployments/webserver/static"
staging = "deployments/webserver/static"
production = "deployments/webserver/static"
