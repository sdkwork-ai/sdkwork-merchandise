# Gateway API locations for non-production hosts (SDKWORK_WEBSERVER_SPEC.md §2.4)
# + Adaptive Web dispatch for `location /` (SDKWORK_DEPLOY_SPEC.md §8.1):
# mobile UA / Sec-CH-UA-Mobile=?1 -> @h5, desktop/iPad -> @pc.

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include snippets/adaptive-web.named-locations.conf;

    location / {
        include snippets/adaptive-web.dispatch.conf;
    }
