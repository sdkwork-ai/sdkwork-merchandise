# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/merchandise/webserver.pid;
error_log /var/log/sdkwork/merchandise/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name merchandise-dev.sdkwork.com merchandise-dev.birdcoder.com merchandise-dev.dtupay.com merchandise-dev.sdkwork.cn merchandise-dev.birdcoder.cn merchandise-dev.dtupay.cn merchandise-dev.skubc.com merchandise-dev.skubc.cn merchandise-dev.zowalk.com merchandise-dev.zowalk.cn merchandise-dev.offer86.com merchandise-dev.offer86.cn merchandise-dev.86offer.com merchandise-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
