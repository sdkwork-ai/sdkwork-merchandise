# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/merchandise/webserver.pid;
error_log /var/log/sdkwork/merchandise/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name merchandise-demo.sdkwork.com merchandise-demo.birdcoder.com merchandise-demo.dtupay.com merchandise-demo.noaper.com merchandise-demo.sdkwork.cn merchandise-demo.birdcoder.cn merchandise-demo.dtupay.cn merchandise-demo.noaper.cn merchandise-demo.skubc.com merchandise-demo.skubc.cn merchandise-demo.zowalk.com merchandise-demo.zowalk.cn merchandise-demo.offer86.com merchandise-demo.offer86.cn merchandise-demo.86offer.com merchandise-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/merchandise/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
